[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-tracker"
version = "0.1.0"
description = "Tracks how long new men's listings on vinted.ro take to sell"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["vinted_tracker", "vinted_tracker.web"]

[tool.setuptools.package-data]
"vinted_tracker.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
